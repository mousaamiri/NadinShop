services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "NadinShop@12345"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=NadinShop;User Id=sa;Password=NadinShop@12345;TrustServerCertificate=True;Encrypt=False"
      Jwt__Issuer: NadinShop.Api
      Jwt__Audience: NadinShop.Client
      Jwt__SigningKey: "NadinShop.Docker.Signing.Key.Change.Me.2026.0123456789"
      Jwt__AccessTokenMinutes: "60"
    ports:
      - "8080:8080"

volumes:
  sqlserver-data:
